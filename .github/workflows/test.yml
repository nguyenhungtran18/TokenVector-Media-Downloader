name: Cross-Platform Execution Tests (Linux, macOS, Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-matrix:
    name: Test CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Mono (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-runtime mono-devel

      - name: Setup Mono (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mono || brew install --cask mono-mdk || true
          echo "/Library/Frameworks/Mono.framework/Versions/Current/bin" >> $GITHUB_PATH

      - name: Verify CLI execution (Windows)
        if: runner.os == 'Windows'
        run: |
          .\tv-downloader-cli.exe
          echo "Windows execution test passed!"

      - name: Verify CLI execution (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          echo "=== Info Mono ==="
          which mono || true
          mono --version || true
          echo "=== Chay Mono CLI ==="
          mono --verbose tv-downloader-cli.exe > mono_out.log 2>&1 || true
          cat mono_out.log
          grep -q "TokenVector Media Downloader Engine" mono_out.log || exit 1
          echo "Done execution test on $RUNNER_OS!"
