name: Cross-Platform Execution Tests (Linux, macOS, Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-matrix:
    name: Test CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Mono (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y mono-runtime mono-devel
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install mono || true
          fi


      - name: Verify CLI execution (Windows)
        if: runner.os == 'Windows'
        run: |
          .\tv-downloader-cli.exe
          echo "Windows execution test passed!"

      - name: Verify CLI execution via Mono (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mono tv-downloader-cli.exe
          echo "Execution test passed!"
